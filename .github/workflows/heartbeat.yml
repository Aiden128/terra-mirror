name: heartbeat

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: terra-heartbeat
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: advance the world
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node engine/tick.mjs
      - name: commit world state
        run: |
          git config user.name "terra-mirror"
          git config user.email "terra-mirror[bot]@users.noreply.github.com"
          git add state/world.json state/pending.json
          git diff --cached --quiet || git commit -m "tick $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          git push
